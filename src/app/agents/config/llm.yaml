# LLM configuration for CrewAI agents
# Default model is Claude Haiku 4.5 for fast, cost-effective inference.
#
# Single source of truth for the model ID: it is set once on the default
# profile (YAML anchor &default_model) and reused by every other profile
# via *default_model. Change the model here and nowhere else.

default:
  model: &default_model "anthropic/claude-haiku-4-5-20251001"
  max_tokens: 4096
  temperature: 0.7

# Alternative configurations for different use cases
fast:
  model: *default_model
  max_tokens: 2048
  temperature: 0.5

creative:
  model: *default_model
  max_tokens: 4096
  temperature: 0.9

precise:
  model: *default_model
  max_tokens: 4096
  temperature: 0.3

conversational:
  model: *default_model
  max_tokens: 1024
  temperature: 0.85  # Higher for more personality variation
