# LLM configuration for CrewAI agents
# Default model is Claude Haiku 4.5 for fast, cost-effective inference

default:
  model: "anthropic/claude-haiku-4-5-20251001"
  max_tokens: 4096
  temperature: 0.7

# Alternative configurations for different use cases
fast:
  model: "anthropic/claude-haiku-4-5-20251001"
  max_tokens: 2048
  temperature: 0.5

creative:
  model: "anthropic/claude-haiku-4-5-20251001"
  max_tokens: 4096
  temperature: 0.9

precise:
  model: "anthropic/claude-haiku-4-5-20251001"
  max_tokens: 4096
  temperature: 0.3

conversational:
  model: "anthropic/claude-haiku-4-5-20251001"
  max_tokens: 1024
  temperature: 0.85  # Higher for more personality variation
